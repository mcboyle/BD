name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'

# A newer push to the same ref supersedes the run in flight: cancel it so the
# stale run stops competing for runners (GitHub and the local Gitea runner alike).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# gitleaks-action@v2 lists the PR's commits to scan its diff, which needs
# pull-requests:read; the default GITHUB_TOKEN is contents:read only, so the
# call 403s ("Resource not accessible by integration") without this block.
permissions:
  contents: read
  pull-requests: read

jobs:
  ci_docs_only:
    name: docs-only CI selection
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      selected_shards: ${{ steps.classify.outputs.selected_shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Classify the exact-head diff for CI selection
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${HEAD_SHA}~1"
          fi
          set +e
          python toolchain/bin/bd-docs-only classify \
            --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA" --json \
            > "$RUNNER_TEMP/docs-only-classification.json"
          classify_rc=$?
          set -e
          python tools/generate_ci_docsonly_shards.py select \
            --repo "$GITHUB_WORKSPACE" --classification-exit "$classify_rc" \
            --github-output "$GITHUB_OUTPUT"

      - name: Generated docs-only shard manifest is current
        run: |
          python -m pip install PyYAML
          python tools/generate_ci_docsonly_shards.py check --repo "$GITHUB_WORKSPACE"

  postgres-integration:
    needs: ci_docs_only
    if: contains(fromJSON(needs.ci_docs_only.outputs.selected_shards), 'postgres-integration')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mod3_ci
          POSTGRES_USER: mod3_ci
          POSTGRES_PASSWORD: mod3_ci_password
        options: >-
          --health-cmd "pg_isready -U mod3_ci -d mod3_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # v3.66.1363 row 420: pip wheel cache, keyed on both requirements
          # manifests. Every job pays the same pip install serially; a warm
          # cache turns the download half of that into a restore. This caches
          # WHEELS, not the installed environment -- install still runs, so a
          # changed pin is still honoured and nothing is trimmed.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install integration-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt "psycopg[binary]>=3.1,<4"

      - name: Run real PostgreSQL integration tests
        env:
          # On GitHub the service is published on the VM, so localhost. Under act
          # (local Gitea runner) the job runs in its own container and reaches
          # the service by name; without this the DSN pointed at the job
          # container's own localhost and the 15 real-DB tests silently skipped
          # (28 passed / 15 skipped locally vs 43 passed on GitHub). The
          # expression is '' on GitHub, so the GitHub DSN is byte-identical.
          MOD3_PG_TEST_DSN: postgresql://mod3_ci:mod3_ci_password@${{ env.GITEA_ACTIONS && 'postgres' || 'localhost' }}:5432/mod3_ci
        run: |
          python -m pytest -q \
            tests/test_v3_66_800_mod3_dual_write.py \
            tests/test_v3_66_801_mod3_shadow_read.py \
            tests/test_v3_66_803_mod3_migration_rehearsal.py \
            tests/test_v3_66_804_mod3_cutover.py

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the PR diff via `git log <base>^..<head>`; the default
          # shallow checkout (depth 1) lacks the base commit, so the range is an
          # "unknown revision" and the scan aborts at ~0 bytes. Full history fixes it.
          fetch-depth: 0

      - name: Secret scan (fails on anything not baselined)
        # gitleaks-action needs a GitHub-issued token/licence; on the local Gitea
        # runner (GITEA_ACTIONS=true) the same scan runs from the pinned binary
        # below with the same config, baseline and exit semantics.
        if: ${{ !env.GITEA_ACTIONS }}
        uses: gitleaks/gitleaks-action@v2
        env:
          # gitleaks-action@v2 requires a token to scan PRs (breaking change,
          # 2025); the auto-provided GITHUB_TOKEN is sufficient for a public/
          # private repo scan -- no gitleaks license key needed for a user repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_BASELINE_PATH: .gitleaks-baseline.json

      - name: Secret scan (local Gitea runner, pinned gitleaks binary)
        if: ${{ env.GITEA_ACTIONS }}
        run: |
          set -euo pipefail
          V=8.24.3
          curl -fsSL -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks version
          # Same range the action scans on GitHub: the commits this PR/push adds.
          git fetch -q origin main
          /tmp/gitleaks git --config .gitleaks.toml --baseline-path .gitleaks-baseline.json --redact --exit-code 1 -v --log-opts="origin/main..HEAD" .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # v3.66.1363 row 420: pip wheel cache, keyed on both requirements
          # manifests. Every job pays the same pip install serially; a warm
          # cache turns the download half of that into a restore. This caches
          # WHEELS, not the installed environment -- install still runs, so a
          # changed pin is still honoured and nothing is trimmed.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Generated artifacts are in sync
        # H702 (O1265h): the indexes are regenerated ON MAIN by bd-regen-main.sh (host cron) after every merge,
        # so this drift check judges main pushes only; a PR carries source and is not expected to be in sync.
        if: github.event_name == 'push'
        run: |
          python -m pip install -r requirements.txt
          python toolchain/bin/bd-regen-order --work "$GITHUB_WORKSPACE"
          # This population is derived through bd-regen-order's independent
          # REQUIRED_CHAIN_LABELS denominator. A second hand-written array got
          # 8 of the chain's 10 tracked outputs and let skipped regeneration
          # go green; the chain authority now emits its own tracked products.
          # A cut that skips one regen must not go green here and make the next
          # cut inherit the drift (measured at v3.66.1016: main carried a
          # STATIC_KB_MANIFEST recording SESSION_CARRY 4317 bytes short, and
          # this job ran the regen that updates the file while checking a
          # denominator excluding its output). The chain's ONE untracked
          # output, reports/gui_parity_inventory.json, is excluded correctly:
          # it is gitignored, and ls-files --error-unmatch would fail on it.
          generated_raw=$(python toolchain/bin/bd-regen-order --tracked-outputs)
          test -n "$generated_raw"
          mapfile -t generated <<<"$generated_raw"
          test "${#generated[@]}" -gt 0
          for artifact in "${generated[@]}"; do
            test -f "$artifact"
            git ls-files --error-unmatch -- "$artifact" >/dev/null
          done
          test -z "$(git status --porcelain --untracked-files=all -- "${generated[@]}")"

      - name: Every .py file must parse
        run: python -m compileall -q bulk_downloader tools tests

      - name: Lint for undefined names and unused imports
        run: |
          pip install pyflakes
          pyflakes bulk_downloader tools || true   # advisory: a known backlog exists

      - name: CHANGELOG current entry must be ASCII
        run: |
          python - <<'PY'
          import re,sys
          t=open('CHANGELOG.md',encoding='utf-8').read().splitlines()
          hdr=[i for i,l in enumerate(t) if l.startswith('## ')]
          if not hdr: sys.exit("::error::no '## ' version header found in CHANGELOG.md")
          entry=t[hdr[0]: (hdr[1] if len(hdr)>1 else len(t))]
          bad=[(hdr[0]+n+1,l) for n,l in enumerate(entry) if any(ord(c)>127 for c in l)]
          for ln,l in bad: print(f"line {ln}: {l!r}")
          if bad: sys.exit("::error::non-ASCII in the current CHANGELOG entry (trips a gate on the host)")
          print(f"ASCII ok across {len(entry)} lines of the current entry")
          PY

      - name: Version pin coherence
        run: |
          python - <<'PY'
          # H668: a bump touches FIVE carriers (toolchain/bin/bd-land-trio PATHS). Check every one and report EVERY
          # mismatch in one run -- exiting on the first cost one CI cycle per missing file (run 35758385351).
          import json,re,sys,subprocess
          v=re.search(r'__version__\s*=\s*"([^"]+)"',open('bulk_downloader/__init__.py').read()).group(1)
          print("__version__ =",v)
          bad=[]
          # the subject is the FIRST '## ' header, wherever it sits -- not a fixed line window
          hdr=next((l for l in open('CHANGELOG.md',encoding='utf-8') if l.startswith('## ')),None)
          if hdr is None: bad.append("CHANGELOG.md: no '## ' version header")
          elif v not in hdr: bad.append(f"CHANGELOG.md: top entry does not name {v}: {hdr.strip()!r}")
          pins=subprocess.run(["grep","-rnE",f'__version__ *== *"{v}"',"tests/"],
                              capture_output=True,text=True).stdout.strip()
          if not pins: bad.append(f"tests/: no test pins __version__ == {v!r} (settings-center slice4 pin test)")
          vp=[e for e in json.load(open('PIN_INDEX.json',encoding='utf-8')).get('pins',[]) if e.get('form')=='version']
          if not vp: bad.append("PIN_INDEX.json: no form=version pin")
          bad+=[f"PIN_INDEX.json: version pin {e.get('file')}:{e.get('line')} = {e.get('value')!r}, not {v!r}" for e in vp if e.get('value')!=v]
          vc=json.load(open('project-knowledge/STATIC_KB_MANIFEST.json',encoding='utf-8')).get('version_context')
          if vc!="v"+v: bad.append(f"project-knowledge/STATIC_KB_MANIFEST.json: version_context {vc!r}, not {'v'+v!r}")
          for b in bad: print(f"::error::{b}")
          if bad: sys.exit(f"{len(bad)} version carrier mismatch(es) against __version__ {v} -- a bump is five carriers together (CLAUDE.md A6)")
          print("pinned by:"); print(pins)
          print("version pins coherent across all five carriers")
          PY

      - name: Guard files unchanged
        run: env -u BD_INSTALL_DIR python toolchain/bin/bd-guardcheck --tree "$PWD"

      # ── The step that makes a green tick mean something ────────────────────
      #
      # Until v3.66.849 this job ran NO pytest at all, and the only job that ran
      # tests was postgres-integration with a four-file list. So CI's entire
      # test denominator was four files, and a green tick meant "no secrets,
      # artifacts in sync, everything parses, CHANGELOG ASCII" -- nothing about
      # whether the cut's own tests passed. MEASURED at v3.66.847: both checks
      # went green on a commit carrying 14 deliberately failing tests. That is a
      # gate reporting OK over a denominator that structurally excludes its
      # subject (CLAUDE.md §0), and it is the CI job itself.
      #
      # WHY THIS SUBSET AND NOT A DERIVED BAND. A band is derived from what a
      # cut CHANGED (CLAUDE.md §4, `bd-band-derive`), and getting that right
      # needs the cut's subject. CI does not have it. What CI can run soundly is
      # the file-INDEPENDENT half: the repo-wide gates whose subject is the tree
      # itself, which are exactly the ones a cut forgets -- a skipped regen, an
      # unbumped pin, a new import edge, a source window that shifted. Every one
      # below holds whatever the diff touched.
      #
      # THIS IS NOT THE BAND AND DOES NOT REPLACE IT. A green run here still
      # says nothing about the changed module's own suites; derive and run those
      # locally. And the box remains the gate (§7) -- these lanes pass in a
      # container that differs from test4 in both directions.

      # Staleness is not caught by any test above: a doc can cite a file that no
      # longer exists, or a register can name a commit this branch never had,
      # while every gate stays green. --repo-only is the set that reads tracked
      # content only, so it means the same thing here as on the box; the full
      # run also checks a gitignored per-machine provisioning report that does
      # not exist in CI, and gating on that would be UNKNOWN forever.
      - name: Docs and register must not be stale
        run: python toolchain/bin/bd-freshcheck --repo-only

  # ── The job that makes a green tick mean something ──────────────────────────
  #
  # Until v3.66.849 CI ran NO pytest outside postgres-integration's four files,
  # so a green tick meant "no secrets, artifacts in sync, everything parses,
  # CHANGELOG ASCII" -- nothing about whether the cut's own tests passed.
  # MEASURED at v3.66.847: both checks went green on a commit carrying 14
  # deliberately failing tests. A gate reporting OK over a denominator that
  # structurally excludes its subject (CLAUDE.md section 0), and it was the CI
  # job itself.
  #
  # WHY THIS SUBSET AND NOT A DERIVED BAND. A band is derived from what a cut
  # CHANGED (CLAUDE.md section 4, bd-band-derive), and getting that right needs
  # the cut's subject. CI does not have it. What CI can run soundly is the
  # file-INDEPENDENT half: the repo-wide gates whose subject is the tree itself,
  # which are exactly the ones a cut forgets -- a skipped regen, an unbumped
  # pin, a new import edge, a source window that shifted.
  #
  # THIS IS NOT THE BAND AND DOES NOT REPLACE IT. A green run still says nothing
  # about the changed module's own suites; derive and run those locally. The box
  # remains the gate (section 7).
  #
  # WHY IT IS SHARDED, v3.66.939. The rule set 2026-08-03 was "81 tests, 52s --
  # keep it under a minute; if it grows past that, SPLIT rather than silently
  # dropping files, because a truncated list here reads as coverage it does not
  # have." Re-measured 2026-08-07 at v3.66.938: 161 tests, 140s. The rule's own
  # remedy is split, and the operator chose it.
  #
  # THE BOUNDARIES ARE DRAWN FROM MEASURED TIME, NOT COUNT, because the lane is
  # nowhere near evenly distributed. Per-file, in a 4-core cloud container:
  #
  #     test_toolchain_534               72.5s    <- 40% of the lane alone
  #     test_gui_parity                  30.6s
  #     test_import_graph_no_new_edges   16.6s
  #     test_v3_66_653_dep_freshness     11.2s
  #     test_route_index_in_sync         10.8s
  #     the remaining ten, combined      38.1s
  #
  # toolchain_534 therefore gets a shard to itself: no two-way split could put
  # every lane under the budget while that file stays whole, and 59s of its 68s
  # is four subprocess-heavy tests walking the 240-tool suite -- not a cheap
  # win, and not safe to trim.
  #
  # A SEPARATE JOB rather than a matrix over `gates`, deliberately: gitleaks,
  # the artifact-sync regen, compileall and the CHANGELOG checks must run ONCE.
  # Sharding those would triple their cost and, for gitleaks, triple an API
  # call for no coverage at all.
  #
  # THE SHARD LISTS ARE GATED. tests/test_v3_66_939_ci_gate_shards_cover_every_gate.py
  # asserts the union is exactly the declared set, that nothing is listed twice,
  # and that every path exists and is tracked. Sharding adds exactly one new
  # failure mode -- a file that falls out of every shard still leaves a GREEN
  # tick -- and that test is the only thing that would notice.
  #
  # Do not "fix" a slow shard by trimming its list. Every entry is a gate that
  # was RED somewhere nothing else could see; see the @850 note below.
  frontend-vitest:
    needs: ci_docs_only
    if: contains(fromJSON(needs.ci_docs_only.outputs.selected_shards), 'frontend-vitest')
    # 122 TRACKED SPEC FILES AND 499 TESTS THAT CI HAS NEVER RUN. vitest.config.ts
    # calls itself "a sandbox-cut gate only" and bd-cut:368 runs it before a
    # deploy, so these specs were not unrun -- they were UN-CI'd, which means no
    # pull request has ever been judged by them. Measured 2026-08-24: the whole
    # suite is green in 14 seconds, so the only reason it was not here is that
    # nobody wired it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: vitest run
        working-directory: frontend
        # --reporter=json is not cosmetic: the denominator check below needs the
        # per-file list, and `vitest run` alone EXITS 0 OVER AN EMPTY COLLECTION.
        # Its exit code cannot distinguish "499 tests passed" from "nothing was
        # collected", which is the whole reason the next step exists.
        run: npx vitest run --reporter=json --outputFile=/tmp/vitest.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # v3.66.1363 row 420: pip wheel cache, keyed on both requirements
          # manifests. Every job pays the same pip install serially; a warm
          # cache turns the download half of that into a restore. This caches
          # WHEELS, not the installed environment -- install still runs, so a
          # changed pin is still honoured and nothing is trimmed.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Every tracked spec file actually ran
        # THE GATE THAT MAKES THE JOB ABOVE MEAN SOMETHING. It reconciles the
        # files vitest reported against `git ls-files`, so a config change that
        # silently stops matching fails here instead of going green over an
        # empty denominator. A missing report is UNKNOWN (exit 2), not a pass.
        run: python tools/check_vitest_denominator.py /tmp/vitest.json --root "$GITHUB_WORKSPACE"

  gate-suites:
    needs: ci_docs_only
    runs-on: ubuntu-latest
    # pytest-timeout runs inside pytest. This is the independent owner bound
    # for a dead interpreter/runner, kept well below Actions' six-hour default.
    timeout-minutes: 30
    strategy:
      # One shard's failure must not cancel the others: a cut usually wants to
      # see every gate that is red, not the first one.
      fail-fast: false
      matrix:
        include:
          # O1264(d)/O1265(g) 2026-09-23: NAMES ONLY. Membership is resolved at run
          # time by tools/ci_shards.py from the declared gate census (BD_GATE_SCOPE
          # markers + the two literal sets in tests/test_v3_66_939_*), so a new gate
          # joins a shard by declaring itself and this file never gains a per-row
          # line (ci.yml was the one path every stacked train collided on).
          # tests/test_ci_shards.py asserts this list == `ci_shards.py names` and
          # test_v3_66_939 asserts the resolved partition covers every declared gate
          # exactly once. Node is provisioned for parity-graph only, Chromium for
          # download-chain only; application-safety is the H686 quarantine.
          - name: version-at-land
          - name: safety-censuses
          - name: mutation-tools
          - name: mutation-tools-b
          - name: artifacts-pins
          - name: application-safety
          - name: isolation
          - name: parity-graph
          - name: download-chain
          - name: gates-rows-a
          - name: gates-rows-b
          - name: gates-v3-a
          - name: gates-v3-b
          - name: gates-named-a
          - name: gates-named-b

    steps:
      - uses: actions/checkout@v4
        if: contains(fromJSON(needs.ci_docs_only.outputs.selected_shards), matrix.name)
        with:
          # LOAD-BEARING for the toolchain shard, and the reason changed at
          # v3.66.884. test_toolchain_534 runs bd-freshcheck, which asserts the
          # register's close-tip commit is an ancestor of HEAD. Under a depth-1
          # checkout that commit is absent and `merge-base --is-ancestor` exits
          # 128 ("I cannot see it"), which is a different thing from 1 ("not in
          # this history").
          #
          # An older comment said the check then returned UNKNOWN (exit 2),
          # failing environmentally rather than really. That was never true.
          # MEASURED in a depth-1 clone: it returned STALE (exit 1) -- fail-
          # WRONG, a confident false accusation against an innocent register
          # section. v3.66.884 repaired it: a nonzero on a shallow clone now
          # deepens and re-asks, so with the remote reachable it returns OK.
          #
          # So the reason to keep full history is no longer "avoid a wrong
          # answer". It is that a depth-1 checkout would make the step reach the
          # NETWORK and DEEPEN the checkout in order to answer at all, and
          # whether that fetch can reach the remote from inside Actions is
          # UNMEASURED -- the OK above was measured in a cloud container, not in
          # CI. Kept on every shard rather than only the toolchain one, because
          # a future re-shuffle of the lists must not silently downgrade it.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: contains(fromJSON(needs.ci_docs_only.outputs.selected_shards), matrix.name)
        with:
          python-version: '3.12'
          # v3.66.1363 row 420: pip wheel cache, keyed on both requirements
          # manifests. Every job pays the same pip install serially; a warm
          # cache turns the download half of that into a restore. This caches
          # WHEELS, not the installed environment -- install still runs, so a
          # changed pin is still honoured and nothing is trimmed.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      # X11 TOOLING FOR THE DISPLAY-OWNERSHIP GATES. Installed on EVERY gate
      # shard on purpose, not only the one that needs it today: the existing
      # fetch-depth comment in this job already records that a future re-shuffle
      # of the suite lists must not silently downgrade a shard, and a shard-name
      # condition here would do exactly that.
      #
      # WITHOUT THIS THE GATES DO NOT EXIST. tests/test_capture_provides_a_display.py
      # skipifs on missing Xvfb, so it has NEVER executed in CI -- it reported
      # green by not running. Row 300's cut then failed CI outright with
      # FileNotFoundError: 'xdpyinfo', which is the honest version of the same
      # condition. CLAUDE.md: a gate CI does not run does not exist.
      # H622: video acceptance uses real ffmpeg; provision it before pytest.
      - name: install X11 and video acceptance utilities
        if: contains(fromJSON(needs.ci_docs_only.outputs.selected_shards), matrix.name)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb x11-utils ffmpeg
          command -v ffmpeg >/dev/null || { echo "ffmpeg absent after install"; exit 1; }
          command -v Xvfb    >/dev/null || { echo "Xvfb absent after install"; exit 1; }
          command -v xdpyinfo >/dev/null || { echo "xdpyinfo absent after install"; exit 1; }

      # NODE, BUT ONLY FOR SHARDS THAT NEED IT. Some gates delegate to Vitest
      # through tests/frontend_vitest.py; others read the installed repository
      # frontend/node_modules directly. Both fail closed when dependencies are
      # absent -- correctly, since a gate that skips when its tool is missing is
      # a gate that does not exist. Installing node on every shard would pay npm
      # ci over and over for nothing, so it is conditional, and
      # tests/test_v3_66_1218_* derives the union of both requirement classes and
      # checks the condition in both directions. NO COUNT IS WRITTEN HERE: this
      # comment said "five" while six gates delegated (v3.66.1236 converted T7
      # and left it stale), and v3.66.1242 makes it seven. The population is
      # re-derived by that test; a number here only goes quietly wrong.
      - uses: actions/setup-node@v4
        if: contains(fromJSON(needs.ci_docs_only.outputs.selected_shards), matrix.name) && matrix.name == 'parity-graph'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies (shards whose gates need node)
        if: contains(fromJSON(needs.ci_docs_only.outputs.selected_shards), matrix.name) && matrix.name == 'parity-graph'
        working-directory: frontend
        run: npm ci

      - name: Install dependencies
        if: contains(fromJSON(needs.ci_docs_only.outputs.selected_shards), matrix.name)
        # BOTH manifests. requirements-test.txt carries the test-only chain
        # (PyYAML among them, which the shard-coverage gate imports), and
        # omitting it would present as a SKIP rather than a failure -- a gate
        # that cannot see its subject reporting OK.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt

      # The row-362 fixture gate executes real Playwright locator semantics, and
      # the row-386 download-chain gate renders its recorded pages in a real
      # browser; missing Chromium is unavailable evidence, never grounds for a
      # skip. Both shards are named here rather than installing everywhere: the
      # pairing is asserted by tests/test_row386_the_download_chain_is_gated.py,
      # so a shard that gains a browser-driven gate cannot silently lose it.
      - name: Install Chromium for browser-driven fixture gates
        if: contains(fromJSON(needs.ci_docs_only.outputs.selected_shards), matrix.name) && matrix.name == 'download-chain'
        run: python -m playwright install --with-deps chromium

      - name: ${{ matrix.name }} gates
        if: contains(fromJSON(needs.ci_docs_only.outputs.selected_shards), matrix.name)
        # The path list comes from tools/ci_shards.py (stdlib, no pip needed):
        # an empty list is exit 3 there and `test -n` here, because pytest with
        # no paths would silently run the whole tree.
        run: |
          suites=$(python tools/ci_shards.py files "${{ matrix.name }}")
          test -n "$suites"
          python toolchain/bin/bd-flake-classifier -- python -m pytest -q -p no:randomly --timeout=240 --timeout-method=signal $suites
        # @850: two of these were added because they were RED somewhere nothing
        # could see.
        #   test_pk_mirrors_do_not_drift -- three project-knowledge mirrors
        #     (bd-band, bd-band-derive, bd-bandcheck) drifted from their
        #     toolchain/bin originals across v3.66.847-849 and sat red on main
        #     the whole time, because no band derived from a changed module
        #     reaches a gate that enumerates the tree.
        #   test_toolchain_534 -- carries the four tool selftests, the
        #     prose-only ratchet, and bd-freshcheck --repo-only.

  # O934.1 (process-test-shard). REDUNDANCY-REPORT-2026-09-19T23:36:50Z.md and
  # CEREMONY-CENSUS-*.md measured 210 precut runs going red on gates that never
  # touch bulk_downloader -- register/harness/toolchain/git process rather than
  # product behavior. gate-suites above is the hot, per-PR product lane; this
  # job is the full tracked tree (all of it, not just tests/PROCESS_TESTS.txt,
  # so a file the classification missed still gets a periodic run instead of
  # silently falling out), run only nightly and on a release train branch,
  # where the wall-clock cost of running everything is acceptable.
  process-tests:
    # One run per head (O1264 a): the train branch is no longer pushed-and-run, so
    # the train-only lane keys on the PR's head ref (github.head_ref is set only
    # on pull_request events) instead of the push ref. Not a per-PR shard, so it
    # stays out of the docs-only manifest (generate_ci_docsonly_shards.py reads
    # a schedule-gated `if` as train-only).
    if: github.event_name == 'schedule' || startsWith(github.head_ref, 'train/')
    runs-on: ubuntu-latest
    # Sized from a measurement, not a guess (RULING-0045 / H674): the 56 declared
    # PROCESS files summed to 772 s of per-test time (--durations=0, remote band
    # 2026-09-22, bd-persist/harness-work/PLAN-2040/W27/process-tests-durations.md),
    # i.e. ~13 min serial on a 64-core host. A 2-core hosted runner is taken at 2x
    # (26 min); 45 min is that with headroom. The old 90 min cap was for
    # `pytest tests/` over 1932 files, which the measured median (3.2 s/file,
    # 103 min) could never fit -- coverage was dropped silently.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run the declared PROCESS tests
        # Only tests/PROCESS_TESTS.txt entries (the files demoted from the hot
        # shards), and NO `-x`: the lane reports every red, not the first.
        run: |
          mapfile -t files < <(grep -v '^#' tests/PROCESS_TESTS.txt | grep -v '^[[:space:]]*$')
          test "${#files[@]}" -gt 0
          pytest "${files[@]}" --timeout=300 -q
