    name: gate-suites (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
        with:
          # LOAD-BEARING for the toolchain shard, and the reason changed at
          # v3.66.884. test_toolchain_534 runs bd-freshcheck, which asserts the
          # register's close-tip commit is an ancestor of HEAD. Under a depth-1
          # checkout that commit is absent and `merge-base --is-ancestor` exits
          # 128 ("I cannot see it"), which is a different thing from 1 ("not in
          # this history").
          #
          # An older comment said the check then returned UNKNOWN (exit 2),
          # failing environmentally rather than really. That was never true.
          # MEASURED in a depth-1 clone: it returned STALE (exit 1) -- fail-
          # WRONG, a confident false accusation against an innocent register
          # section. v3.66.884 repaired it: a nonzero on a shallow clone now
          # deepens and re-asks, so with the remote reachable it returns OK.
          #
          # So the reason to keep full history is no longer "avoid a wrong
          # answer". It is that a depth-1 checkout would make the step reach the
          # NETWORK and DEEPEN the checkout in order to answer at all, and
          # whether that fetch can reach the remote from inside Actions is
          # UNMEASURED -- the OK above was measured in a cloud container, not in
          # CI. Kept on every shard rather than only the toolchain one, because
          # a future re-shuffle of the lists must not silently downgrade it.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # X11 TOOLING FOR THE DISPLAY-OWNERSHIP GATES. Installed on EVERY gate
      # shard on purpose, not only the one that needs it today: the existing
      # fetch-depth comment in this job already records that a future re-shuffle
      # of the suite lists must not silently downgrade a shard, and a shard-name
      # condition here would do exactly that.
      #
      # WITHOUT THIS THE GATES DO NOT EXIST. tests/test_capture_provides_a_display.py
      # skipifs on missing Xvfb, so it has NEVER executed in CI -- it reported
      # green by not running. Row 300's cut then failed CI outright with
      # FileNotFoundError: 'xdpyinfo', which is the honest version of the same
      # condition. CLAUDE.md: a gate CI does not run does not exist.
      - name: install X11 utilities for display-ownership gates
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb x11-utils
          command -v Xvfb    >/dev/null || { echo "Xvfb absent after install"; exit 1; }
          command -v xdpyinfo >/dev/null || { echo "xdpyinfo absent after install"; exit 1; }

      # NODE, BUT ONLY FOR THE SHARD THAT NEEDS IT. The T-series wired gates
      # delegate to Vitest through tests/frontend_vitest.py, which asserts the
      # vitest binary exists rather than skipping when it does not -- correctly,
      # since a gate that skips when its tool is missing is a gate that does not
      # exist. They live in the parity-graph shard, so without this they would
      # fail on EVERY CI run. Installing node on every shard to serve them would
      # pay npm ci over and over for nothing, so it is conditional, and
      # tests/test_v3_66_1218_* asserts the condition still covers every shard
      # that actually delegates. NO COUNT IS WRITTEN HERE ON PURPOSE: this
      # comment said "five" while six gates delegated (v3.66.1236 converted T7
      # and left it stale), and v3.66.1242 makes it seven. The population is
      # re-derived by that test; a number here only goes quietly wrong.
      - uses: actions/setup-node@v4
        if: matrix.name == 'parity-graph'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies (shards that delegate to vitest)
        if: matrix.name == 'parity-graph'
        working-directory: frontend
        run: npm ci

      - name: Install dependencies
        # BOTH manifests. requirements-test.txt carries the test-only chain
        # (PyYAML among them, which the shard-coverage gate imports), and
        # omitting it would present as a SKIP rather than a failure -- a gate
        # that cannot see its subject reporting OK.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: ${{ matrix.name }} gates
        run: >-
          python -m pytest -q -p no:randomly
          --timeout=240 --timeout-method=signal
          ${{ matrix.suites }}
        # @850: two of these were added because they were RED somewhere nothing
        # could see.
        #   test_pk_mirrors_do_not_drift -- three project-knowledge mirrors
        #     (bd-band, bd-band-derive, bd-bandcheck) drifted from their
        #     toolchain/bin originals across v3.66.847-849 and sat red on main
        #     the whole time, because no band derived from a changed module
        #     reaches a gate that enumerates the tree.
        #   test_toolchain_534 -- carries the four tool selftests, the
        #     prose-only ratchet, and bd-freshcheck --repo-only.
