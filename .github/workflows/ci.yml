name: CI

on:
  push:
    branches: [main]
  pull_request:

# gitleaks-action@v2 lists the PR's commits to scan its diff, which needs
# pull-requests:read; the default GITHUB_TOKEN is contents:read only, so the
# call 403s ("Resource not accessible by integration") without this block.
permissions:
  contents: read
  pull-requests: read

jobs:
  postgres-integration:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mod3_ci
          POSTGRES_USER: mod3_ci
          POSTGRES_PASSWORD: mod3_ci_password
        options: >-
          --health-cmd "pg_isready -U mod3_ci -d mod3_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install integration-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt "psycopg[binary]>=3.1,<4"

      - name: Run real PostgreSQL integration tests
        env:
          MOD3_PG_TEST_DSN: postgresql://mod3_ci:mod3_ci_password@localhost:5432/mod3_ci
        run: |
          python -m pytest -q \
            tests/test_v3_66_800_mod3_dual_write.py \
            tests/test_v3_66_801_mod3_shadow_read.py \
            tests/test_v3_66_803_mod3_migration_rehearsal.py \
            tests/test_v3_66_804_mod3_cutover.py

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the PR diff via `git log <base>^..<head>`; the default
          # shallow checkout (depth 1) lacks the base commit, so the range is an
          # "unknown revision" and the scan aborts at ~0 bytes. Full history fixes it.
          fetch-depth: 0

      - name: Secret scan (fails on anything not baselined)
        uses: gitleaks/gitleaks-action@v2
        env:
          # gitleaks-action@v2 requires a token to scan PRs (breaking change,
          # 2025); the auto-provided GITHUB_TOKEN is sufficient for a public/
          # private repo scan -- no gitleaks license key needed for a user repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_BASELINE_PATH: .gitleaks-baseline.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generated artifacts are in sync
        run: |
          python -m pip install -r requirements.txt
          python toolchain/bin/bd-regen-order --work "$GITHUB_WORKSPACE"
          # This array must enumerate every TRACKED output of bd-regen-order's
          # CHAIN, or a cut that skips one regen goes green here and the next
          # cut inherits the drift (measured at v3.66.1016: main carried a
          # STATIC_KB_MANIFEST recording SESSION_CARRY 4317 bytes short, and
          # this job ran the regen that updates the file while checking a
          # denominator excluding its output). The chain's ONE untracked
          # output, reports/gui_parity_inventory.json, is excluded correctly:
          # it is gitignored, and ls-files --error-unmatch would fail on it.
          generated=(
            ROUTE_INDEX.json ENDPOINT_CATALOG.md DEPENDENCY_GRAPH.json
            DEPENDENCY_GRAPH.md FUNCTION_INDEX.md PIN_INDEX.json
            frontend/src/lib/secretKeys.generated.ts
            project-knowledge/STATIC_KB_MANIFEST.json
          )
          for artifact in "${generated[@]}"; do
            test -f "$artifact"
            git ls-files --error-unmatch -- "$artifact" >/dev/null
          done
          test -z "$(git status --porcelain --untracked-files=all -- "${generated[@]}")"

      - name: Every .py file must parse
        run: python -m compileall -q bulk_downloader tools tests

      - name: Lint for undefined names and unused imports
        run: |
          pip install pyflakes
          pyflakes bulk_downloader tools || true   # advisory: a known backlog exists

      - name: CHANGELOG current entry must be ASCII
        run: |
          python - <<'PY'
          import re,sys
          t=open('CHANGELOG.md',encoding='utf-8').read().splitlines()
          hdr=[i for i,l in enumerate(t) if l.startswith('## ')]
          if not hdr: sys.exit("::error::no '## ' version header found in CHANGELOG.md")
          entry=t[hdr[0]: (hdr[1] if len(hdr)>1 else len(t))]
          bad=[(hdr[0]+n+1,l) for n,l in enumerate(entry) if any(ord(c)>127 for c in l)]
          for ln,l in bad: print(f"line {ln}: {l!r}")
          if bad: sys.exit("::error::non-ASCII in the current CHANGELOG entry (trips a gate on the host)")
          print(f"ASCII ok across {len(entry)} lines of the current entry")
          PY

      - name: Version pin coherence
        run: |
          python - <<'PY'
          import re,sys,subprocess
          v=re.search(r'__version__\s*=\s*"([^"]+)"',open('bulk_downloader/__init__.py').read()).group(1)
          print("__version__ =",v)
          # the subject is the FIRST '## ' header, wherever it sits -- not a fixed line window
          hdr=next((l for l in open('CHANGELOG.md',encoding='utf-8') if l.startswith('## ')),None)
          if hdr is None: sys.exit("::error::no '## ' version header in CHANGELOG.md")
          if v not in hdr: sys.exit(f"::error::CHANGELOG top entry does not name {v}: {hdr.strip()!r}")
          pins=subprocess.run(["grep","-rnE",f'__version__ *== *"{v}"',"tests/"],
                              capture_output=True,text=True).stdout.strip()
          if not pins: sys.exit(f"::error::no test pins {v} -- a bump is three edits together (CLAUDE.md 3)")
          print("pinned by:"); print(pins)
          print("version pins coherent")
          PY

      - name: Guard files unchanged
        run: env -u BD_INSTALL_DIR python toolchain/bin/bd-guardcheck --tree "$PWD"

      # ── The step that makes a green tick mean something ────────────────────
      #
      # Until v3.66.849 this job ran NO pytest at all, and the only job that ran
      # tests was postgres-integration with a four-file list. So CI's entire
      # test denominator was four files, and a green tick meant "no secrets,
      # artifacts in sync, everything parses, CHANGELOG ASCII" -- nothing about
      # whether the cut's own tests passed. MEASURED at v3.66.847: both checks
      # went green on a commit carrying 14 deliberately failing tests. That is a
      # gate reporting OK over a denominator that structurally excludes its
      # subject (CLAUDE.md §0), and it is the CI job itself.
      #
      # WHY THIS SUBSET AND NOT A DERIVED BAND. A band is derived from what a
      # cut CHANGED (CLAUDE.md §4, `bd-band-derive`), and getting that right
      # needs the cut's subject. CI does not have it. What CI can run soundly is
      # the file-INDEPENDENT half: the repo-wide gates whose subject is the tree
      # itself, which are exactly the ones a cut forgets -- a skipped regen, an
      # unbumped pin, a new import edge, a source window that shifted. Every one
      # below holds whatever the diff touched.
      #
      # THIS IS NOT THE BAND AND DOES NOT REPLACE IT. A green run here still
      # says nothing about the changed module's own suites; derive and run those
      # locally. And the box remains the gate (§7) -- these lanes pass in a
      # container that differs from test4 in both directions.

      # Staleness is not caught by any test above: a doc can cite a file that no
      # longer exists, or a register can name a commit this branch never had,
      # while every gate stays green. --repo-only is the set that reads tracked
      # content only, so it means the same thing here as on the box; the full
      # run also checks a gitignored per-machine provisioning report that does
      # not exist in CI, and gating on that would be UNKNOWN forever.
      - name: Docs and register must not be stale
        run: python toolchain/bin/bd-freshcheck --repo-only

  # ── The job that makes a green tick mean something ──────────────────────────
  #
  # Until v3.66.849 CI ran NO pytest outside postgres-integration's four files,
  # so a green tick meant "no secrets, artifacts in sync, everything parses,
  # CHANGELOG ASCII" -- nothing about whether the cut's own tests passed.
  # MEASURED at v3.66.847: both checks went green on a commit carrying 14
  # deliberately failing tests. A gate reporting OK over a denominator that
  # structurally excludes its subject (CLAUDE.md section 0), and it was the CI
  # job itself.
  #
  # WHY THIS SUBSET AND NOT A DERIVED BAND. A band is derived from what a cut
  # CHANGED (CLAUDE.md section 4, bd-band-derive), and getting that right needs
  # the cut's subject. CI does not have it. What CI can run soundly is the
  # file-INDEPENDENT half: the repo-wide gates whose subject is the tree itself,
  # which are exactly the ones a cut forgets -- a skipped regen, an unbumped
  # pin, a new import edge, a source window that shifted.
  #
  # THIS IS NOT THE BAND AND DOES NOT REPLACE IT. A green run still says nothing
  # about the changed module's own suites; derive and run those locally. The box
  # remains the gate (section 7).
  #
  # WHY IT IS SHARDED, v3.66.939. The rule set 2026-08-03 was "81 tests, 52s --
  # keep it under a minute; if it grows past that, SPLIT rather than silently
  # dropping files, because a truncated list here reads as coverage it does not
  # have." Re-measured 2026-08-07 at v3.66.938: 161 tests, 140s. The rule's own
  # remedy is split, and the operator chose it.
  #
  # THE BOUNDARIES ARE DRAWN FROM MEASURED TIME, NOT COUNT, because the lane is
  # nowhere near evenly distributed. Per-file, in a 4-core cloud container:
  #
  #     test_toolchain_534               72.5s    <- 40% of the lane alone
  #     test_gui_parity                  30.6s
  #     test_import_graph_no_new_edges   16.6s
  #     test_v3_66_653_dep_freshness     11.2s
  #     test_route_index_in_sync         10.8s
  #     the remaining ten, combined      38.1s
  #
  # toolchain_534 therefore gets a shard to itself: no two-way split could put
  # every lane under the budget while that file stays whole, and 59s of its 68s
  # is four subprocess-heavy tests walking the 240-tool suite -- not a cheap
  # win, and not safe to trim.
  #
  # A SEPARATE JOB rather than a matrix over `gates`, deliberately: gitleaks,
  # the artifact-sync regen, compileall and the CHANGELOG checks must run ONCE.
  # Sharding those would triple their cost and, for gitleaks, triple an API
  # call for no coverage at all.
  #
  # THE SHARD LISTS ARE GATED. tests/test_v3_66_939_ci_gate_shards_cover_every_gate.py
  # asserts the union is exactly the declared set, that nothing is listed twice,
  # and that every path exists and is tracked. Sharding adds exactly one new
  # failure mode -- a file that falls out of every shard still leaves a GREEN
  # tick -- and that test is the only thing that would notice.
  #
  # Do not "fix" a slow shard by trimming its list. Every entry is a gate that
  # was RED somewhere nothing else could see; see the @850 note below.
  gate-suites:
    runs-on: ubuntu-latest
    strategy:
      # One shard's failure must not cancel the others: a cut usually wants to
      # see every gate that is red, not the first one.
      fail-fast: false
      matrix:
        include:
          - name: toolchain
            suites: >-
              tests/test_toolchain_534.py
              tests/test_v3_66_1052_the_backlog_is_machine_visible.py
              tests/test_v3_66_1142_fleet_run_is_hermetic.py
              tests/test_v3_66_1158_fleet_provenance_fails_closed.py
              tests/test_v3_66_1159_fleet_prune_is_object_bound.py
              tests/test_v3_66_1160_bridge_verifier_isolation.py
              tests/test_v3_66_1161_context_census_is_retired.py
              tests/test_v3_66_1162_canonical_full_suite_uses_fixed_n24.py
              tests/test_v3_66_1164_one_task_authority.py
              tests/test_v3_66_1165_one_agent_contract.py
              tests/test_v3_66_1166_historical_docs_are_adjudicated.py
              tests/test_v3_66_1167_safety_authorities_are_single_source.py
              tests/test_v3_66_1168_tests_are_current_contracts.py
              tests/test_v3_66_1169_openapi_has_one_producer.py
              tests/test_v3_66_1170_claude_is_concise_authority.py
              tests/test_v3_66_1171_backlog_truth_is_current.py
              tests/test_v3_66_1172_nested_freshness_and_legacy_retirement.py
              tests/test_v3_66_1173_gate_scope_debt_is_paid.py
              tests/test_v3_66_1174_defect_suppressions_are_ast_bound.py
              tests/test_v3_66_1177_ai_boot_observation_is_bounded.py
              tests/test_v3_66_1178_orphan_tempfiles_are_recursive.py
              tests/test_v3_66_1179_frontend_secret_regen_is_canonical.py
              tests/test_frontend_secret_keys_in_sync.py
              tests/test_templates_list_identity.py
              tests/test_defect_scan_precision.py
              tests/test_v3_66_1145_step0_fails_closed.py
              tests/test_v3_66_1149_a_cut_never_deletes_the_operators_database.py
              tests/test_v3_66_1150_the_snapshot_is_really_sealed.py
              tests/test_v3_66_1151_the_snapshot_is_bound_to_a_descriptor.py
              tests/test_v3_66_1152_a_failed_cleanup_fails_the_run.py
              tests/test_v3_66_1153_deletion_is_bound_to_the_object.py
              tests/test_v3_66_1154_the_object_not_the_name.py
              tests/test_v3_66_1157_build_output_is_from_this_attempt.py
          - name: parity-graph
            suites: >-
              tests/test_gui_parity.py
              tests/test_t1_dashboard_wired.py
              tests/test_t2_history_wired.py
              tests/test_t3_t4_wired.py
              tests/test_t5_t6_wired.py
              tests/test_t7_notifications_wired.py
              tests/test_t8_cluster_wired.py
              tests/test_t9a_live_stream_wired.py
              tests/test_t9b_push_wired.py
              tests/test_t10_devtools_wired.py
              tests/test_t11_approval_wired.py
              tests/test_config_parity_ratchet.py
              tests/test_skip_baseline.py
              tests/test_v3_66_1181_capture_reconciliation.py
              tests/test_csrf_session_bootstrap.py
              tests/test_csrf_contract_reachability.py
              tests/test_csrf_tool_contracts.py
              tests/test_spa_root_routing_contract.py
              tests/test_cockpit_route_contract.py
              tests/test_cockpit_navigation_contract.py
              tests/test_import_graph_no_new_edges.py
              tests/test_v3_66_653_dep_freshness.py
              tests/test_route_index_in_sync.py
          # @1072 adds four suites here, and the last of them is THE GATE THAT
          # GUARDS THIS MATRIX. Until now it ran nowhere: it was created at
          # f736748, the same commit that deleted the `gates` job's pytest step,
          # and appeared in that diff only inside a comment. So from v3.66.939
          # to v3.66.1071 the only check that would notice a suite falling out
          # of every shard was itself a suite that had fallen out of every one.
          #
          # A comment cannot go INSIDE the `>-` block below: a folded scalar is
          # text, so a `#` line there becomes part of the suites string and
          # pytest is handed its words as paths.
          - name: measurement-tools
            suites: >-
              tests/test_v3_66_1046_gates_for_this_sessions_shapes.py
              tests/test_v3_66_1044_run_context_and_chains.py
              tests/test_v3_66_1043_measurement_and_fleet_tools.py
              tests/test_v3_66_1040_remote_job_registry.py
              tests/test_v3_66_1068_modwatch_measures_per_file.py
              tests/test_v3_66_1062_vision_probes_are_loadable_images.py
              tests/test_v3_66_1064_provisioning_paths_do_not_diverge.py
              tests/test_v3_66_1184_mutation_specs_are_tracked.py
              tests/test_v3_66_1185_bd_mutate_emits_canonical_specs.py
              tests/test_v3_66_1186_bd_mutate_named_controls.py
              tests/test_v3_66_1187_bd_mutate_band_is_bounded.py
              tests/test_v3_66_1188_bd_mutate_review_controls.py
              tests/test_v3_66_1189_bd_mutate_durable_contract.py
              tests/test_v3_66_1190_bd_mutate_kills_process_tree.py
              tests/test_v3_66_939_ci_gate_shards_cover_every_gate.py
          - name: isolation
            suites: >-
              tests/test_v3_66_1034_guards_survive_a_module_wipe.py
              tests/test_v3_66_1031_socket_recorder_stages.py
              tests/test_no_test_writes_the_repo_plugins_dir.py
              tests/test_v3_66_1067_the_leaker_census_reads_code_not_prose.py
              tests/test_v3_66_1080_the_suite_reclaims_its_tmpdirs.py
              tests/test_v3_66_1085_module_identity_survives_a_sys_modules_patch.py
          - name: tree-gates-1
            suites: >-
              tests/test_v3_66_1018_registrable_domain_drain.py
              tests/test_census_file_size_drift.py
              tests/test_zip_era_tools_stay_retired.py
              tests/test_v3_66_1117_cockpit_home_stays_retired.py
          - name: tree-gates-2
            suites: >-
              tests/test_v3_66_1013_registrable_domain.py
              tests/test_history_records_whether_bytes_were_fetched.py
              tests/test_v3_66_972_library_missing_stays_retired.py
          - name: tree-gates-3
            suites: >-
              tests/test_v3_66_820_share_tools_saw_no_session_keys.py
              tests/test_history_file_size_is_the_size_on_disk.py
              tests/test_playwright_engines_single_source.py
          - name: tree-gates-4
            suites: >-
              tests/test_v3_66_1098_no_assertion_can_be_trivially_true.py
              tests/test_v3_66_1108_no_assertion_can_be_trivially_false.py
              tests/test_v3_66_938_atomic_write_sidecars_are_ignored.py
              tests/test_v3_66_935_scan_wait_reports_non_convergence.py
              tests/test_history_columns_go_through_migrations.py
              tests/test_v3_66_1059_recorder_derives_its_blind_spot_counts.py
              tests/test_v3_66_968_anchor_gate_sees_frontend_citations.py
              tests/test_codex_handoff_stays_retired.py
              tests/test_sandbox_home_stays_retired.py
              tests/test_deploy_manifest_stays_retired.py
              tests/test_gitignore_rules_actually_match.py
              tests/test_task_tracker_stays_retired.py
              tests/test_v3_66_918_tracked_source_denominator.py
              tests/test_v3_66_944_static_kb_manifest_describes_the_tree.py
              tests/test_generated_artifact_workflow.py
              tests/test_git_deploy_gaps_are_documented.py
          - name: toolchain-verifiers
            suites: >-
              tests/test_desandbox_tool_verifiers.py
          - name: artifacts-pins
            suites: >-
              tests/test_generated_artifacts_are_not_tracked.py
              tests/test_source_windows_do_not_shift.py
              tests/test_pk_mirrors_stay_retired.py
              tests/test_authority_documents.py
              tests/test_v3_66_1183_inv_tags_generated.py
              tests/test_v3_66_1183_safe_temp_janitors.py
              tests/test_v3_66_1183_source_window_content.py
              tests/test_pin_index_in_sync.py
              tests/test_all_sources_parse.py
              tests/test_versync_gate.py
              tests/test_settings_center_slice4.py
              tests/test_v3_66_799_audit_tool_selftests.py
              tests/test_release_hygiene_gates.py
              tests/test_scan_version_pins_fixture.py
    name: gate-suites (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
        with:
          # LOAD-BEARING for the toolchain shard, and the reason changed at
          # v3.66.884. test_toolchain_534 runs bd-freshcheck, which asserts the
          # register's close-tip commit is an ancestor of HEAD. Under a depth-1
          # checkout that commit is absent and `merge-base --is-ancestor` exits
          # 128 ("I cannot see it"), which is a different thing from 1 ("not in
          # this history").
          #
          # An older comment said the check then returned UNKNOWN (exit 2),
          # failing environmentally rather than really. That was never true.
          # MEASURED in a depth-1 clone: it returned STALE (exit 1) -- fail-
          # WRONG, a confident false accusation against an innocent register
          # section. v3.66.884 repaired it: a nonzero on a shallow clone now
          # deepens and re-asks, so with the remote reachable it returns OK.
          #
          # So the reason to keep full history is no longer "avoid a wrong
          # answer". It is that a depth-1 checkout would make the step reach the
          # NETWORK and DEEPEN the checkout in order to answer at all, and
          # whether that fetch can reach the remote from inside Actions is
          # UNMEASURED -- the OK above was measured in a cloud container, not in
          # CI. Kept on every shard rather than only the toolchain one, because
          # a future re-shuffle of the lists must not silently downgrade it.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # BOTH manifests. requirements-test.txt carries the test-only chain
        # (PyYAML among them, which the shard-coverage gate imports), and
        # omitting it would present as a SKIP rather than a failure -- a gate
        # that cannot see its subject reporting OK.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: ${{ matrix.name }} gates
        run: python -m pytest -q -p no:randomly ${{ matrix.suites }}
        # @850: two of these were added because they were RED somewhere nothing
        # could see.
        #   test_pk_mirrors_do_not_drift -- three project-knowledge mirrors
        #     (bd-band, bd-band-derive, bd-bandcheck) drifted from their
        #     toolchain/bin originals across v3.66.847-849 and sat red on main
        #     the whole time, because no band derived from a changed module
        #     reaches a gate that enumerates the tree.
        #   test_toolchain_534 -- carries the four tool selftests, the
        #     prose-only ratchet, and bd-freshcheck --repo-only.
