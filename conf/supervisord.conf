; BulkDL sandbox supervisor config.
; Run with: supervisord -c /home/claude/supervisord/conf/supervisord.conf
; Manage with: supervisorctl -c <same path> {status,start,stop,restart}

[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; --- BulkDL Flask app ---
; Adjust command + directory once you know where BulkDL is extracted.
[program:bulkdownloader]
command=/home/claude/work/venv/bin/python /home/claude/work/downloader_ui.py
directory=/home/claude/work
environment=BD_HOME="/home/claude/bd_home",BD_DISABLE_KEEPALIVE="1"
autostart=false
autorestart=true
stdout_logfile=/tmp/bd_app.log
stderr_logfile=/tmp/bd_app.err

; --- Ollama (if ollama kit is installed) ---
[program:ollama]
command=/home/claude/ollama_kit/bin/ollama serve
environment=OLLAMA_MODELS="/home/claude/ollama_kit/models"
autostart=false
autorestart=true
stdout_logfile=/tmp/ollama.log
stderr_logfile=/tmp/ollama.err

; --- Apprise capture (if apprise kit is installed) ---
[program:apprise_capture]
command=/usr/bin/python3 /home/claude/apprise_kit/apprise_capture.py
autostart=false
autorestart=true
stdout_logfile=/tmp/apprise.log
stderr_logfile=/tmp/apprise.err

; --- Media-server mocks (if mocks kit is installed) ---
[program:mock_plex]
command=/usr/bin/python3 /home/claude/mocks_kit/bin/mock_plex.py --port 32400
autostart=false
autorestart=true
stdout_logfile=/tmp/plex.log

[program:mock_jellyfin]
command=/usr/bin/python3 /home/claude/mocks_kit/bin/mock_jellyfin.py --port 8096
autostart=false
autorestart=true
stdout_logfile=/tmp/jellyfin.log

[program:mock_stash]
command=/usr/bin/python3 /home/claude/mocks_kit/bin/mock_stash.py --port 9999
autostart=false
autorestart=true
stdout_logfile=/tmp/stash.log
